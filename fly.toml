# Change `app` to something unique before `fly launch --no-deploy --copy-config`
app = "find-the-bot-varish"
primary_region = "bom"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Rooms live in memory, so never stop or scale out the machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
